name: ${AIRHOP_COMPOSE_PROJECT_NAME:-airhop-center-demo}

services:
  hermes-parent-runtime:
    profiles: [hermes]
    build:
      context: ../..
      dockerfile: integrations/hermes-airhop-parent-runtime/Dockerfile
    image: ${AIRHOP_HERMES_RUNTIME_IMAGE:-airhop-hermes-parent-runtime:local}
    environment:
      BUZZ_RELAY_URL: ${AIRHOP_HERMES_RELAY_URL:-}
      BUZZ_PRIVATE_KEY: ${AIRHOP_HERMES_AGENT_SECRET_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BUZZ_ACP_AGENT_COMMAND: hermes-acp
      BUZZ_ACP_AGENT_ARGS: ""
      BUZZ_ACP_MCP_COMMAND: airhop-agent-mcp
      BUZZ_AIRHOP_ROLE: parent_administrator
      BUZZ_ACP_SYSTEM_PROMPT_FILE: /opt/airhop-hermes/persona.md
      BUZZ_ACP_SESSION_TITLE: Администратор Гермес
      BUZZ_ACP_DISPLAY_NAME: Администратор Гермес
      BUZZ_ACP_MODEL: ${AIRHOP_HERMES_MODEL:-deepseek-v4-flash}
      BUZZ_ACP_SUBSCRIBE: all
      BUZZ_ACP_NO_MENTION_FILTER: "true"
      BUZZ_ACP_RESPOND_TO: anyone
      BUZZ_ACP_DEDUP: queue
      BUZZ_ACP_MULTIPLE_EVENT_HANDLING: queue
      BUZZ_ACP_AGENTS: "1"
      BUZZ_ACP_NO_MEMORY: "true"
      BUZZ_ACP_NO_BASE_PROMPT: "true"
      BUZZ_ACP_HEARTBEAT_INTERVAL: "0"
      BUZZ_ACP_IDLE_TIMEOUT: ${AIRHOP_HERMES_IDLE_TIMEOUT_SECONDS:-180}
      BUZZ_ACP_MAX_TURN_DURATION: ${AIRHOP_HERMES_MAX_TURN_SECONDS:-300}
      HERMES_ACP_MAX_ITERATIONS: ${AIRHOP_HERMES_MAX_ITERATIONS:-8}
      RUST_LOG: ${AIRHOP_HERMES_RUST_LOG:-buzz_acp=info,buzz_dev_mcp=info}
    volumes:
      - airhop-hermes-runtime-data:/var/lib/airhop-hermes-runtime
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    networks: [airhop-net]

  telegram-gateway:
    profiles: [telegram]
    build:
      context: ../..
      dockerfile: integrations/hermes-airhop-channel-gateway/Dockerfile
    image: ${AIRHOP_TELEGRAM_GATEWAY_IMAGE:-airhop-hermes-channel-gateway:local}
    environment:
      AIRHOP_RELAY_URL: ${AIRHOP_GATEWAY_RELAY_URL:-}
      AIRHOP_CONNECTION_ID: ${AIRHOP_TELEGRAM_CONNECTION_ID:-}
      AIRHOP_CONNECTOR_SECRET_KEY: ${AIRHOP_TELEGRAM_CONNECTOR_SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${AIRHOP_TELEGRAM_BOT_TOKEN:-}
      AIRHOP_GATEWAY_STATE_ROOT: /var/lib/airhop-channel-gateway/connections
      TELEGRAM_WEBHOOK_URL: ${AIRHOP_TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${AIRHOP_TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_HOST: 0.0.0.0
      TELEGRAM_WEBHOOK_PORT: "8443"
    volumes:
      - airhop-telegram-gateway-data:/var/lib/airhop-channel-gateway
    ports:
      - "127.0.0.1:${AIRHOP_TELEGRAM_WEBHOOK_PORT:-8443}:8443"
    restart: unless-stopped
    networks: [airhop-net]

  relay:
    image: ${AIRHOP_IMAGE:?set AIRHOP_IMAGE}
    env_file:
      - ${AIRHOP_ENV_FILE:-.env}
    environment:
      # The relay still consumes the shared deployment env file for its own
      # optional tuning, but must not inherit credentials owned by the hosted
      # model runtime or the provider gateway.
      AIRHOP_HERMES_AGENT_SECRET_KEY: ""
      DEEPSEEK_API_KEY: ""
      AIRHOP_TELEGRAM_CONNECTOR_SECRET_KEY: ""
      AIRHOP_TELEGRAM_BOT_TOKEN: ""
      AIRHOP_TELEGRAM_WEBHOOK_SECRET: ""
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-airhop}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-airhop}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-airhop-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_SERVE_AIRHOP_PUBLIC_WEB: "true"
      BUZZ_SERVE_GIT_WEB_GUI: "false"
      BUZZ_AIRHOP_PUBLIC_BOOKING_INDEX_KEY: ${BUZZ_AIRHOP_PUBLIC_BOOKING_INDEX_KEY:?set BUZZ_AIRHOP_PUBLIC_BOOKING_INDEX_KEY}
      BUZZ_AIRHOP_PUBLIC_BOOKING_MANAGEMENT_KEYS: ${BUZZ_AIRHOP_PUBLIC_BOOKING_MANAGEMENT_KEYS:?set BUZZ_AIRHOP_PUBLIC_BOOKING_MANAGEMENT_KEYS}
      BUZZ_AIRHOP_PUBLIC_BOOKING_CURRENT_KEY_VERSION: ${BUZZ_AIRHOP_PUBLIC_BOOKING_CURRENT_KEY_VERSION:-1}
      BUZZ_AIRHOP_CHANNEL_CREDENTIAL_INDEX_KEY: ${BUZZ_AIRHOP_CHANNEL_CREDENTIAL_INDEX_KEY:?set BUZZ_AIRHOP_CHANNEL_CREDENTIAL_INDEX_KEY}
      BUZZ_AIRHOP_CHANNEL_CREDENTIAL_KEYS: ${BUZZ_AIRHOP_CHANNEL_CREDENTIAL_KEYS:?set BUZZ_AIRHOP_CHANNEL_CREDENTIAL_KEYS}
      BUZZ_AIRHOP_CHANNEL_CURRENT_KEY_VERSION: ${BUZZ_AIRHOP_CHANNEL_CURRENT_KEY_VERSION:-1}
      BUZZ_AIRHOP_TELEGRAM_CONNECTOR_PUBKEY: ${AIRHOP_TELEGRAM_CONNECTOR_PUBKEY:?set AIRHOP_TELEGRAM_CONNECTOR_PUBKEY}
    ports:
      - "127.0.0.1:${AIRHOP_HTTP_PORT:-3300}:3000"
    labels:
      traefik.enable: "${AIRHOP_TRAEFIK_ENABLED:-false}"
      traefik.docker.network: "${AIRHOP_DOCKER_NETWORK:-airhop-center-demo-net}"
      traefik.http.routers.airhop-center.entrypoints: websecure
      traefik.http.routers.airhop-center.rule: "Host(`${AIRHOP_PUBLIC_HOST:-demo.example.com}`)"
      traefik.http.routers.airhop-center.tls: "true"
      traefik.http.routers.airhop-center.tls.certresolver: letsencrypt
      traefik.http.services.airhop-center.loadbalancer.server.port: "3000"
    volumes:
      - airhop-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks: [airhop-net]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airhop}
      POSTGRES_USER: ${POSTGRES_USER:-airhop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - airhop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks: [airhop-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - airhop-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 18
    restart: unless-stopped
    networks: [airhop-net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
    volumes:
      - airhop-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    networks: [airhop-net]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-airhop-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
      '
    restart: "no"
    networks: [airhop-net]

volumes:
  airhop-hermes-runtime-data:
  airhop-telegram-gateway-data:
  airhop-postgres-data:
  airhop-redis-data:
  airhop-minio-data:
  airhop-git-data:

networks:
  airhop-net:
    name: ${AIRHOP_DOCKER_NETWORK:-airhop-center-demo-net}
    driver: bridge
